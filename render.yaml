services:
  - type: web
    name: laoxiangji-disclosure
    runtime: static
    buildCommand: echo "Static H5 site — no build"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
