<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#007a37" />
  <title>老乡鸡经营证照公示</title>
  <script src="flex.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="top-bar">
      <h1 class="top-title">经营证照公示</h1>
    </header>

    <section class="brand-hero">
      <div class="brand-hero__bg" aria-hidden="true"></div>
      <div class="brand-hero__content">
        <div class="brand-logo">
          <img class="brand-logo__img" src="assets/logo.png" width="56" height="56" alt="老乡鸡" />
          <div class="brand-meta">
            <p class="logo-text">老乡鸡</p>
            <p class="logo-sub">经营证照公示平台</p>
          </div>
        </div>
        <p class="hero-desc">请选择要查看的资质类型</p>
      </div>
    </section>

    <main class="content content--hub">
      <nav class="hub-menu" aria-label="资质类型">
        <a href="stores.html" class="hub-card">
          <span class="hub-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2v-2h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
          </span>
          <span class="hub-card__body">
            <span class="hub-card__title">门店资质</span>
            <span class="hub-card__desc">查看各门店营业执照、食品经营许可证</span>
          </span>
          <span class="hub-card__arrow" aria-hidden="true">›</span>
        </a>
        <a href="platform.html" class="hub-card">
          <span class="hub-card__icon hub-card__icon--alt" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
          </span>
          <span class="hub-card__body">
            <span class="hub-card__title">平台资质</span>
            <span class="hub-card__desc">平台营业执照、经营许可证、单用途预付卡备案</span>
          </span>
          <span class="hub-card__arrow" aria-hidden="true">›</span>
        </a>
      </nav>
    </main>
  </div>
</body>
</html>
