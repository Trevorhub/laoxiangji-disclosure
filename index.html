<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#007a37" />
  <title>老乡鸡餐厅信息公示</title>
  <script src="flex.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="top-bar">
      <button type="button" class="icon-btn back-btn" aria-label="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <h1 class="top-title">餐厅信息公示</h1>
      <span class="top-spacer" aria-hidden="true"></span>
    </header>

    <section class="brand-hero">
      <div class="brand-hero__bg" aria-hidden="true"></div>
      <div class="brand-hero__content">
        <div class="brand-logo">
          <img class="brand-logo__img" src="assets/logo.png" width="56" height="56" alt="老乡鸡" />
          <div class="brand-meta">
            <p class="logo-text">老乡鸡</p>
            <p class="logo-sub">餐厅信息公示平台</p>
          </div>
        </div>
        <p class="hero-desc">请选择省份、城市查看门店，或搜索门店名称</p>
      </div>
    </section>

    <main class="content">
      <section class="filter-card" aria-label="筛选门店">
        <div class="filters">
          <div class="filter-row">
            <div class="filter-field">
              <label class="field-label" for="province">省</label>
              <div class="select-wrap">
                <select id="province" class="filter-select">
                  <option value="">全部</option>
                </select>
                <span class="select-arrow" aria-hidden="true"></span>
              </div>
            </div>
            <div class="filter-field">
              <label class="field-label" for="city">市</label>
              <div class="select-wrap">
                <select id="city" class="filter-select" disabled>
                  <option value="">全部</option>
                </select>
                <span class="select-arrow" aria-hidden="true"></span>
              </div>
            </div>
          </div>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/>
            </svg>
            <label class="sr-only" for="keyword">搜索门店</label>
            <input
              id="keyword"
              type="search"
              class="search-input"
              placeholder="搜索门店名称"
              autocomplete="off"
            />
            <button type="button" id="clearKeyword" class="clear-btn hidden" aria-label="清除搜索">×</button>
          </div>
        </div>
      </section>

      <div class="list-header">
        <p class="result-count" id="resultCount" aria-live="polite"></p>
      </div>

      <ul class="store-list" id="storeList"></ul>

      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56">
            <circle cx="32" cy="32" r="30" fill="#e8f5ec"/>
            <path fill="#007a37" d="M32 18c-5.5 0-10 4.5-10 10 0 7.5 10 18 10 18s10-10.5 10-18c0-5.5-4.5-10-10-10zm0 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
          </svg>
        </div>
        <p class="empty-title">暂无匹配门店</p>
        <p class="empty-desc">试试调整省份、城市或搜索关键词</p>
        <button type="button" class="text-btn" id="resetFilters">重置筛选</button>
      </div>
    </main>

    <div class="modal hidden" id="licenseModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <div class="modal-handle" aria-hidden="true"></div>
        <header class="modal-header">
          <div class="modal-header__text">
            <p class="modal-tag" id="modalTag">证照公示</p>
            <h3 id="modalTitle">证照预览</h3>
          </div>
          <button type="button" class="icon-btn modal-close" data-close aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </header>
        <div class="modal-body">
          <p class="modal-store" id="modalStoreName"></p>
          <div id="licenseSingle" class="license-mode">
            <div class="license-viewport" id="licenseViewport">
              <div class="license-rotator" id="licenseRotator">
                <img id="licenseImage" class="license-image" src="" alt="" />
              </div>
            </div>
          </div>
          <div id="licenseAll" class="license-mode hidden"></div>
          <div class="license-toolbar" id="licenseToolbarGlobal">
            <button type="button" class="toolbar-btn" id="rotateLeft" aria-label="逆时针旋转">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.11 8.53 5.7 7.11C4.8 8.27 4.24 9.61 4.07 11h2.02c.14-.87.49-1.72 1.02-2.47zM6.09 13H4.07c.17 1.39.72 2.73 1.62 3.89l1.41-1.42c-.52-.75-.87-1.59-1.01-2.47zm1.01 5.32 1.41 1.42c1.04-1.17 1.65-2.61 1.73-4.14H8.14c-.07 1.16-.45 2.25-1.04 3.22zM12 4.07V2.05c-2.01.2-3.86.88-5.32 1.93l1.42 1.42A7.94 7.94 0 0 1 12 4.07zm7.92 2.97-1.41-1.41A7.948 7.948 0 0 0 12 5.09V7.1c1.57.18 3.02.76 4.24 1.58l1.68-1.63zm-2.02 6.98c-.14.87-.49 1.72-1.02 2.47l1.41 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.01zm-1.04 5.32c-.59.97-.97 2.06-1.04 3.22h2.02c.08-1.53.69-2.97 1.73-4.14l-1.41-1.42c-.53.75-.88 1.6-1.02 2.47zM12 19.93v2.02c2.01-.2 3.86-.88 5.32-1.93l-1.42-1.42a7.948 7.948 0 0 1-3.9 1.33zm-5.32-1.93 1.42 1.42A7.948 7.948 0 0 0 12 21.95v-2.02a7.94 7.94 0 0 1-3.9-1.33l-1.42 1.33z"/></svg>
              左转
            </button>
            <span class="rotate-degree" id="rotateDegree">0°</span>
            <button type="button" class="toolbar-btn" id="rotateRight" aria-label="顺时针旋转">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.55 5.55 14.12 4.12a8.003 8.003 0 0 0-8.07 11.88h2.02c.14-1.16.49-2.01 1.02-2.76l1.41 1.41c-.9 1.16-1.45 2.5-1.62 3.89h2.02c.17-1.39.72-2.73 1.62-3.89l-1.42-1.42c.53-.75.88-1.6 1.02-2.47zm-1.04 5.32c-.14.87-.49 1.72-1.02 2.47l1.41 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.01c-.07 1.16-.45 2.25-1.04 3.22zM12 4.07V2.05c-2.01.2-3.86.88-5.32 1.93l1.42 1.42A7.94 7.94 0 0 1 12 4.07zm7.92 2.97-1.41-1.41A7.948 7.948 0 0 0 12 5.09V7.1c1.57.18 3.02.76 4.24 1.58l1.68-1.63zm-2.02 6.98c-.14.87-.49 1.72-1.02 2.47l1.41 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.01zm-1.04 5.32c-.59.97-.97 2.06-1.04 3.22h2.02c.08-1.53.69-2.97 1.73-4.14l-1.41-1.42c-.53.75-.88 1.6-1.02 2.47zM12 19.93v2.02c2.01-.2 3.86-.88 5.32-1.93l-1.42-1.42a7.948 7.948 0 0 1-3.9 1.33zm-5.32-1.93 1.42 1.42A7.948 7.948 0 0 0 12 21.95v-2.02a7.94 7.94 0 0 1-3.9-1.33l-1.42 1.33z"/></svg>
              右转
            </button>
            <button type="button" class="toolbar-btn toolbar-btn--ghost" id="resetRotate" aria-label="重置旋转">重置</button>
          </div>
          <p class="modal-tip">点击卡片空白处查看全部证照 · 每张证照可单独旋转 · 信息仅供参考</p>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
